name: Build DOCX via Pandoc

on:
  workflow_call:
    inputs:
      input_dir:
        required: true
        type: string
      output_name:
        required: true
        type: string
      config:
        required: false
        type: string
        default: ''
      shared_ref:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout shared workflow files
        uses: actions/checkout@v6
        with:
          repository: kyonenya/pandoc-jp-docx
          ref: ${{ inputs.shared_ref }}

      - name: Checkout caller repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: caller

      - name: Convert Markdown to DOCX
        id: pandoc
        uses: docker://pandoc/core:latest
        with:
          entrypoint: /bin/sh
          args: >-
            build-pandoc.sh
            ${{ inputs.input_dir }}
            dist/${{ inputs.output_name }}.docx
            "${{ inputs.config }}"

      - name: Fix generated file ownership
        run: sudo chown -R "$USER:$USER" caller/dist

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Postprocess DOCX numbering
        run: ./postprocess/numbering.sh "caller/dist/${{ inputs.output_name }}.docx"

      - name: Publish DOCX
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_branch: ${{ github.ref_name }}_pandoc-${{ inputs.output_name }}
          publish_dir: caller/dist
          commit_message: 'Publish DOCX: '
          force_orphan: true
          disable_nojekyll: true
