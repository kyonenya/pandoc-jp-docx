name: Build DOCX via Pandoc

on:
  workflow_call:
    inputs:
      input_folder:
        required: true
        type: string
      output_file:
        required: false
        type: string
        default: ''
      config:
        required: false
        type: string
        default: ''
      shared_ref:
        required: true
        type: string
      name:
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout shared workflow files
        uses: actions/checkout@v6
        with:
          repository: kyonenya/pandoc-jp-docx
          ref: ${{ inputs.shared_ref }}

      - name: Checkout caller repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: caller

      - name: Convert Markdown to DOCX
        id: pandoc
        uses: docker://pandoc/core:latest
        with:
          entrypoint: /bin/sh
          args: >-
            build-pandoc.sh
            "${{ inputs.input_folder }}"
            "${{ inputs.config }}"
            "${{ inputs.output_file }}"

      - name: Fix generated file ownership
        run: sudo chown -R "$USER:$USER" "${{ steps.pandoc.outputs.publish_dir }}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Postprocess DOCX numbering
        run: ./postprocess-numbering.sh "${{ steps.pandoc.outputs.output_file }}"

      - name: Publish DOCX
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_branch: ${{ github.ref_name }}_pandoc-${{ inputs.name || steps.pandoc.outputs.name }}
          publish_dir: ${{ steps.pandoc.outputs.publish_dir }}
          commit_message: 'Publish DOCX: '
          force_orphan: true
          disable_nojekyll: true
