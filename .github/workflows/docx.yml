name: Build DOCX via Pandoc

on:
  workflow_call:
    inputs:
      input_pattern:
        required: true
        type: string
      output_name:
        required: true
        type: string
      defaults:
        required: false
        type: string
        default: ''
      pdf:
        required: false
        type: boolean
        default: false
    secrets:
      ms_client_id:
        required: false
      ms_refresh_token:
        required: false
      gh_secrets_write_pat:
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout shared workflow files
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Checkout caller repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: caller

      - name: Convert Markdown to DOCX
        id: pandoc
        uses: docker://pandoc/core:latest
        with:
          entrypoint: /bin/sh
          args: >-
            build.sh
            caller/${{ inputs.input_pattern }}
            caller/dist/${{ inputs.output_name }}.docx
            ${{ inputs.defaults && format('--defaults=caller/{0}', inputs.defaults) || '' }}
            --no-postprocess

      - name: Fix generated file ownership
        run: sudo chown -R "$USER:$USER" caller/dist

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Postprocess DOCX numbering
        run: ./postprocess/numbering.sh "caller/dist/${{ inputs.output_name }}.docx"

      - name: Convert DOCX to PDF
        if: ${{ inputs.pdf }}
        continue-on-error: true
        env:
          MS_CLIENT_ID: ${{ secrets.ms_client_id }}
          MS_REFRESH_TOKEN: ${{ secrets.ms_refresh_token }}
          MS_REFRESH_TOKEN_OUTPUT_PATH: ${{ runner.temp }}/ms-refresh-token
        run: node ./postprocess/pdf.mts "caller/dist/${{ inputs.output_name }}.docx" "caller/dist/${{ inputs.output_name }}.pdf"

      - name: Update Microsoft refresh token
        if: ${{ inputs.pdf }}
        env:
          GH_TOKEN: ${{ secrets.gh_secrets_write_pat }}
          MS_REFRESH_TOKEN_OUTPUT_PATH: ${{ runner.temp }}/ms-refresh-token
        run: |
          trap 'rm -f "$MS_REFRESH_TOKEN_OUTPUT_PATH"' EXIT

          [ ! -s "$MS_REFRESH_TOKEN_OUTPUT_PATH" ] && exit 0
          [ -z "$GH_TOKEN" ] \
            && echo '::warning::gh_secrets_write_patが設定されていないため、MS_REFRESH_TOKENを自動更新できません' && exit 0

          gh secret set MS_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$MS_REFRESH_TOKEN_OUTPUT_PATH" \
            || echo '::warning::MS_REFRESH_TOKENの自動更新に失敗しました。成果物の公開処理を続行します'

      - name: Publish documents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd caller/dist

          git init -b "${{ github.ref_name }}_pandoc-${{ inputs.output_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Publish documents: ${{ github.sha }}"

          gh auth setup-git
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git push --force origin HEAD
