name: Build Sample DOCX

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  with-toc:
    uses: kyonenya/pandoc-jp-docx/.github/workflows/docx.yml@dev
    with:
      input_pattern: sample/[0-9]*.md
      output_name: single-with-toc
      config: sample/defaults.yml
      shared_ref: dev

  defaults-only:
    uses: kyonenya/pandoc-jp-docx/.github/workflows/docx.yml@dev
    with:
      input_pattern: sample/[0-9]*.md
      output_name: single-defaults-only
      shared_ref: dev
