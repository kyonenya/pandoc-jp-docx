name: Build Sample DOCX

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  no-config:
    uses: kyonenya/pandoc-jp-docx/.github/workflows/docx.yml@dev
    with:
      input_pattern: sample/[0-9]*.md
      output_name: no-config
      shared_ref: dev

  with-config:
    uses: kyonenya/pandoc-jp-docx/.github/workflows/docx.yml@dev
    with:
      input_pattern: sample/[0-9]*.md
      output_name: with-config
      defaults: sample/defaults.yml
      shared_ref: dev
